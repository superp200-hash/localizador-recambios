<style>
:root{--bg:#f4f6f8;--card:#fff;--text:#18212b;--muted:#687481;--accent:#e53935;--border:#dfe4e8;--shadow:0 8px 24px rgba(20,30,40,.08)}
*{box-sizing:border-box} body{margin:0;background:var(--bg);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial,sans-serif}
header{background:#18212b;color:white;padding:24px 18px 28px} .wrap{max-width:1100px;margin:auto}
h1{margin:0;font-size:26px} .sub{margin-top:6px;color:#cbd3da;font-size:14px}
.controls{margin-top:-18px;background:var(--card);border:1px solid var(--border);border-radius:16px;padding:16px;box-shadow:var(--shadow);display:grid;grid-template-columns:1fr 180px;gap:12px}
input,select{width:100%;height:48px;border:1px solid var(--border);border-radius:12px;padding:0 14px;font-size:16px;background:white;outline:none}
input:focus,select:focus{border-color:#8c9aa7;box-shadow:0 0 0 3px rgba(140,154,167,.15)}
.stats{display:flex;justify-content:space-between;align-items:center;margin:20px 2px 10px;color:var(--muted);font-size:14px}
.results{display:grid;gap:12px;padding-bottom:40px}
.card{background:white;border:1px solid var(--border);border-radius:16px;padding:17px;box-shadow:0 3px 12px rgba(20,30,40,.04)}
.top{display:flex;gap:10px;align-items:center;flex-wrap:wrap} .badge{font-size:12px;font-weight:700;padding:6px 9px;border-radius:999px;background:#edf1f4;color:#4d5964}
.brand{font-weight:800;font-size:19px} .piece{font-size:18px;font-weight:700;margin-top:9px}
.route{margin-top:14px;display:flex;gap:7px;flex-wrap:wrap;align-items:center}
.step{background:#f1f4f6;border:1px solid #e0e5e8;border-radius:10px;padding:10px 12px;font-weight:700}
.arrow{color:#8a959e;font-weight:800}
.note{margin-top:11px;color:#a33;font-size:13px;font-weight:700}
.copy{margin-top:14px;border:0;border-radius:10px;padding:10px 13px;background:#18212b;color:#fff;font-weight:700;cursor:pointer}
.empty{text-align:center;padding:45px 15px;color:var(--muted);background:white;border:1px dashed var(--border);border-radius:16px}
@media(max-width:700px){.controls{grid-template-columns:1fr} header{padding-bottom:30px} h1{font-size:22px} .piece{font-size:17px}}
</style>
</head>

function escapeHtml(s){return String(s).replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[m]))}
